<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover">
<title>Репетиция: актёрские тренинги</title>
<meta name="theme-color" content="#7A1F3D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Репетиция">
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#E9EEF0;--surface:#fff;--ink:#14232B;--muted:#5B6B73;--accent:#7A1F3D;--on-accent:#fff;--spot:#E8B93C;--line:#cfd8dc;--ok:#1d7a4d;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161A;--surface:#19222A;--ink:#EDF1F2;--muted:#9fb0b8;--accent:#E2708F;--on-accent:#1a0d12;--line:#2b3943;--ok:#5fd29a;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#10161A;--surface:#19222A;--ink:#EDF1F2;--muted:#9fb0b8;--accent:#E2708F;--on-accent:#1a0d12;--line:#2b3943;--ok:#5fd29a;--bad:#ff8a80}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 Onest,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding:20px 18px 24px}
h1,h2,h3{font-family:Prata,Georgia,serif;font-weight:400;line-height:1.2;margin:0}
h1{font-size:30px;margin-bottom:4px}h2{font-size:24px;margin-bottom:10px}h3{font-size:19px}
p{margin:0 0 10px}.muted{color:var(--muted);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--spot);outline-offset:2px}
input[type=search]{width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;margin:14px 0 10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chip{flex:none;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:14px}
.chip[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.lbl{font-size:13px;color:var(--muted);margin:6px 0 2px}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px}
.card .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.card .school{color:var(--accent);font-weight:600;font-size:14px;margin-bottom:2px}
.btn{display:block;width:100%;padding:14px;border-radius:12px;border:0;background:var(--accent);color:var(--on-accent);font-weight:600;margin-top:12px}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.back{background:none;border:0;padding:4px 0 12px;color:var(--muted)}
ol.steps{padding-left:22px;margin:10px 0}ol.steps li{margin-bottom:8px}
nav{display:flex;border-top:1px solid var(--line);background:var(--surface)}
nav button{flex:1;padding:12px 4px 10px;background:none;border:0;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button[aria-current=page]{color:var(--accent);font-weight:600;box-shadow:inset 0 3px 0 var(--spot)}
nav .ic{font-size:20px;line-height:1}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:14px 0}.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.timer{font:400 64px/1 Prata,serif;text-align:center;margin:18px 0 6px;font-variant-numeric:tabular-nums}
.opt{display:block;width:100%;text-align:left;padding:14px;margin:0 0 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.expl{padding:12px 14px;border-left:4px solid var(--spot);background:var(--surface);border-radius:8px;margin:6px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.stat b{display:block;font:400 32px/1.1 Prata,serif;color:var(--accent)}
.fav{float:right;background:none;border:0;font-size:22px;color:var(--accent);padding:0 0 0 8px}
textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;resize:vertical}
textarea:focus-visible{outline:3px solid var(--spot);outline-offset:2px}
details.card summary{cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Адаптация под экран телефона ===== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{height:100%;overscroll-behavior:none}
body{font-size:15px;line-height:1.45}
#app{height:100vh;height:100dvh}
main{padding:16px 14px 20px;-webkit-overflow-scrolling:touch}
h1{font-size:clamp(22px,6.4vw,28px)}
h2{font-size:clamp(19px,5.4vw,22px)}
h3{font-size:clamp(16px,4.6vw,18px)}
.muted{font-size:13px}
.card{padding:13px;margin-bottom:10px}
.card .meta{font-size:12px}
.card .school{font-size:13px}
.chip{padding:6px 12px;font-size:13px}
.btn{padding:13px;font-size:15px}
.opt{padding:12px;font-size:15px}
.timer{font-size:clamp(44px,15vw,60px)}
nav{padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{padding:9px 2px 7px;font-size:11px}
nav .ic{font-size:18px}
@media (min-width:600px){body{font-size:16px}main{padding:20px 18px 24px}}
main>:first-child{padding-right:44px}
#themeBtn{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:max(12px,calc((100vw - 560px)/2 + 12px));z-index:50;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 2px 8px rgba(0,0,0,.12)}

/* ===== Жёсткая подгонка по ширине экрана ===== */
html,body{width:100%;max-width:100vw;overflow-x:hidden}
#app{width:100%;max-width:min(560px,100%)}
main,nav{min-width:0}
nav button{min-width:0;overflow:hidden}
.ic svg{display:block}
#themeBtn svg{display:block}
.card,.btn,.opt,input[type=search]{max-width:100%}
.card p,.card h3,h1,h2,h3,p{overflow-wrap:anywhere}
</style>
</head>
<body>
<div id="app"><main id="view"></main>
<nav id="nav"></nav></div>
<script>
const T=[
{id:1,t:"Магическое «если бы»",s:"Станиславский",g:["Воображение","Эмоции"],m:10,d:"Учит верить в предлагаемые обстоятельства и действовать в них искренне.",st:[["Выберите простую ситуацию: вы ждёте друга в кафе.",60],["Спросите себя: «Что бы я делал, если бы друг опаздывал на час?» Ответьте телом, не словами.",90],["Добавьте обстоятельство: у вас важная новость. Как меняется поведение?",90],["Добавьте ещё одно: в кафе сидит человек, которого вы избегаете.",90],["Запишите, в какой момент вы поверили в происходящее.",60]]},
{id:2,t:"Повторение",s:"Мейснер",g:["Партнёр","Внимание"],m:15,d:"Классическое упражнение на живую реакцию. Нужен партнёр.",st:[["Сядьте напротив партнёра. Один наблюдает и называет то, что видит: «Ты улыбаешься».",60],["Партнёр повторяет фразу слово в слово: «Я улыбаюсь».",60],["Повторяйте, пока фраза не начнёт меняться от настоящего чувства.",120],["Поменяйтесь ролями.",120],["Обсудите, когда повторение стало живым, а не механическим.",60]]},
{id:3,t:"Психологический жест",s:"Чехов",g:["Тело","Эмоции"],m:12,d:"Одним большим жестом находите внутреннее состояние персонажа.",st:[["Встаньте свободно, расслабьте плечи.",30],["Сделайте сильный жест «толкаю». Почувствуйте, куда идёт энергия.",60],["Теперь жест «беру к себе». Заметьте, чем отличается состояние.",60],["Придумайте жест для своего персонажа: его главное желание.",90],["Уменьшите жест до едва заметного, оставив внутреннее ощущение.",90]]},
{id:4,t:"Эмоциональная память",s:"Страсберг",g:["Эмоции"],m:15,d:"Использует личный опыт, чтобы вызвать подлинное чувство. Работайте бережно.",st:[["Выберите безопасное воспоминание умеренной силы, не самое тяжёлое.",45],["Вспомните место: что вы видели, слышали, чувствовали по запаху?",90],["Вспомните ощущения тела: температура, поза, дыхание.",90],["Позвольте воспоминанию вернуть чувство и не играйте его.",90],["Мягко вернитесь в настоящее: потяните плечи, назовите три предмета вокруг.",45]]},
{id:5,t:"Круги внимания",s:"Станиславский",g:["Внимание"],m:8,d:"Тренирует управление вниманием и «публичное одиночество».",st:[["Малый круг: сосредоточьтесь на одном предмете в руках.",60],["Средний круг: охватите стол или себя и партнёра.",60],["Большой круг: включите всю комнату, звуки и людей.",60],["Переключайтесь между кругами по хлопку или по таймеру.",120]]},
{id:6,t:"«Да, и…»",s:"Импровизация",g:["Партнёр","Воображение"],m:10,d:"Главное правило импровизации: принять предложение и развить его.",st:[["Партнёр предлагает идею: «Мы на луне».",30],["Вы отвечаете «Да, и…» и добавляете деталь.",90],["Продолжайте по очереди, не отрицая сказанное.",150],["Поменяйте стартовую идею и повторите.",150]]},
{id:7,t:"Дыхание и резонаторы",s:"Голос и тело",g:["Голос","Тело"],m:10,d:"Базовая голосовая разминка перед работой.",st:[["Встаньте ровно. Вдох носом на 4 счёта, выдох на «с» на 8.",60],["Мычание «м-м-м»: найдите вибрацию в губах, носу, груди.",60],["Сирена: плавно от низкого звука к высокому на «у».",60],["Произнесите скороговорку, не напрягая горло, три раза всё быстрее.",90]]},
{id:8,t:"Зеркало",s:"Голос и тело",g:["Партнёр","Внимание","Тело"],m:8,d:"Развивает точность наблюдения и синхронность с партнёром.",st:[["Встаньте лицом к партнёру. Один ведёт медленные движения.",90],["Второй отражает их как зеркало.",90],["Поменяйтесь ролями.",90],["Теперь без ведущего: пусть движение рождается само.",120]]},
{id:9,t:"Физические действия",s:"Станиславский",g:["Тело","Воображение"],m:15,d:"Правдивые простые действия приводят к правдивому чувству.",st:[["Выберите действие: собираете чемодан перед срочным отъездом.",30],["Выполните его реально, с каждым предметом.",120],["Найдите причину: куда и почему вы уезжаете?",90],["Повторите с этой причиной и сравните ощущения.",120]]},
{id:10,t:"Тишина и присутствие",s:"Мейснер",g:["Внимание","Эмоции"],m:7,d:"Короткая практика для старта репетиции.",st:[["Сядьте, закройте глаза, отследите дыхание.",60],["Откройте глаза и заметьте пять деталей вокруг.",60],["Скажите вслух одну честную фразу о том, как вы себя чувствуете.",60]]},
{id:11,t:"Артикуляционная разминка",s:"Речь и дыхание",g:["Артикуляция","Дикция"],m:5,d:"Короткая зарядка для губ, языка и челюсти перед чтением вслух или репетицией.",st:[["Губы: по очереди растягивайте в широкую улыбку и вытягивайте «трубочкой», по 10 раз.",45],["Язык: проведите кончиком по зубам, как будто чистите их, сначала в одну сторону, потом в другую.",45],["«Лошадка»: щёлкайте языком, присасывая его к нёбу, 10 раз.",30],["Челюсть: широко зевните, затем пожуйте воображаемую жвачку.",30],["Проговорите «па-та-ка» медленно, потом быстрее, сохраняя чёткость.",45]]},
{id:12,t:"Диафрагмальное дыхание",s:"Речь и дыхание",g:["Дыхание"],m:6,d:"Учит дышать животом: это даёт ровный голос и спокойствие на сцене.",st:[["Встаньте ровно или лягте на спину. Одну руку положите на живот, другую на грудь.",30],["Вдохните носом на 4 счёта так, чтобы поднималась рука на животе, а грудь почти не двигалась.",60],["Медленно выдохните ртом, живот опускается. Без усилия и без напряжения плеч.",60],["Повторите вдох и выдох ещё 8 раз в своём темпе.",90],["Прислушайтесь: стали ли вы спокойнее? Если закружилась голова, дышите обычно.",30]]},
{id:13,t:"Ровный выдох на «с»",s:"Речь и дыхание",g:["Дыхание","Голос"],m:5,d:"Тренирует длину и ровность выдоха, на котором держится речь.",st:[["Вдохните носом на 4 счёта, выдыхайте на «с» ровной струёй на 8 счётов.",60],["Повторите, постепенно удлиняя выдох до 10 и 12 счётов. Не форсируйте.",90],["То же самое на звуки «ш» и «ф».",60],["Если закружилась голова, остановитесь и подышите спокойно.",30]]},
{id:14,t:"Скороговорки в трёх темпах",s:"Речь и дыхание",g:["Дикция","Артикуляция"],m:7,d:"Классическая работа над чёткостью звуков: медленно, шёпотом, быстро.",st:[["Выберите скороговорку, например «Карл у Клары украл кораллы». Произнесите медленно, чётко выговаривая каждый звук.",60],["Повторите шёпотом, сильно двигая губами и языком, потом обычным голосом.",60],["Ускоряйте темп, пока речь остаётся чёткой. Сбились: вернитесь к медленному темпу.",90],["Скажите её с разными чувствами: радостно, сердито, устало.",90]]},
{id:15,t:"Чтение как диктор",s:"Речь и дыхание",g:["Дикция"],m:6,d:"Отрабатывает чёткие согласные и осмысленные паузы на любом тексте.",st:[["Возьмите любой абзац книги или статьи.",15],["Прочитайте вслух очень медленно, подчёркивая каждую согласную в конце слов.",90],["Расставьте паузы: после каждой мысли делайте вдох и короткую остановку.",90],["Прочитайте ещё раз в обычном темпе, сохранив чёткость и паузы.",90]]}
];
const Q=[
{q:"Кто автор системы, в основе которой лежит «магическое если бы»?",o:["Константин Станиславский","Ли Страсберг","Санфорд Мейснер","Михаил Чехов"],a:0,e:"«Если бы» помогает поверить в предлагаемые обстоятельства."},
{q:"Что лежит в основе техники Мейснера?",o:["Эмоциональная память","Живая реакция на партнёра в моменте","Заученные жесты","Работа только с текстом"],a:1,e:"Упражнение «Повторение» учит слушать и реагировать, а не играть заранее придуманное."},
{q:"С каким именем связан «психологический жест»?",o:["Станиславский","Михаил Чехов","Гротовский","Брехт"],a:1,e:"Чехов использовал жест как способ найти внутреннее состояние роли."},
{q:"Какой метод опирается на эмоциональную память?",o:["Метод Страсберга","Лабан","Комедия дель арте","Эпический театр"],a:0,e:"Страсберг развивал идею использовать личный опыт для вызова чувства."},
{q:"Главное правило «Да, и…»?",o:["Спорить с партнёром","Принять предложение и развить его","Молчать","Играть заранее придуманное"],a:1,e:"Принятие и развитие идеи держат сцену живой."},
{q:"Что такое сверхзадача?",o:["Первая реплика","Главная цель роли и спектакля","Костюм персонажа","Пауза"],a:1,e:"Сквозное действие роли ведёт к сверхзадаче."},
{q:"Что означает «четвёртая стена»?",o:["Декорация","Воображаемая граница между сценой и залом","Задник сцены","Суфлёрская будка"],a:1,e:"Актёр играет так, будто зрителя нет."},
{q:"Что такое подтекст?",o:["Скрытый смысл за словами","Ремарка автора","Название пьесы","Громкость голоса"],a:0,e:"Подтекст — то, что персонаж думает и хочет, но не произносит."},
{q:"Что прежде всего развивают «Круги внимания»?",o:["Умение управлять вниманием","Силу голоса","Память на текст","Гибкость тела"],a:0,e:"Переключаясь между малым, средним и большим кругом, актёр учится держать внимание там, где нужно."},
{q:"Что тренирует упражнение «Повторение» Мейснера?",o:["Дикцию","Пластику","Живую реакцию на партнёра","Знание пьесы"],a:2,e:"Партнёры слушают друг друга и реагируют на настоящее, а не на заранее придуманное."},
{q:"Что развивает «Психологический жест» Чехова?",o:["Скорость речи","Связь тела и внутреннего состояния","Умение петь","Запоминание реплик"],a:1,e:"Телесный жест помогает найти желание и эмоцию персонажа."},
{q:"Какие навыки развивает упражнение «Зеркало»?",o:["Точность наблюдения и синхронность с партнёром","Громкость голоса","Умение запоминать текст","Чувство юмора"],a:0,e:"Чтобы отражать движения, нужно очень внимательно следить за партнёром."},

<script>
/* ===== PWA: превращает сайт в устанавливаемое приложение ===== */
(function(){
  var NAME="Репетиция: актёрские тренинги",SHORT="Репетиция",COLOR="#7A1F3D";
  // Иконка рисуется на лету (без отдельных файлов)
  function icon(size){
    var c=document.createElement('canvas');c.width=c.height=size;var x=c.getContext('2d');
    x.fillStyle=COLOR;x.fillRect(0,0,size,size);
    x.fillStyle='#E8B93C';x.beginPath();x.arc(size/2,size*0.42,size*0.2,0,7);x.fill();
    x.fillStyle='#fff';x.font='bold '+size*0.24+'px Georgia,serif';x.textAlign='center';x.textBaseline='middle';
    x.fillText('Р',size/2,size*0.78);
    return c.toDataURL('image/png');
  }
  var i192=icon(192),i512=icon(512);
  var ai=document.createElement('link');ai.rel='apple-touch-icon';ai.href=i192;document.head.appendChild(ai);
  var fi=document.createElement('link');fi.rel='icon';fi.href=i192;document.head.appendChild(fi);
  // Манифест создаётся из кода
  var manifest={name:NAME,short_name:SHORT,lang:"ru",display:"standalone",orientation:"portrait",
    start_url:location.pathname,scope:location.pathname.replace(/[^\/]*$/,''),
    background_color:"#E9EEF0",theme_color:COLOR,
    icons:[{src:i192,sizes:"192x192",type:"image/png",purpose:"any maskable"},{src:i512,sizes:"512x512",type:"image/png",purpose:"any maskable"}]};
  var ml=document.createElement('link');ml.rel='manifest';
  ml.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));
  document.head.appendChild(ml);
  // Офлайн-режим: подключается, если рядом лежит sw.js
  if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
  // Кнопка «Установить» (Android / Chrome / Edge)
  var ev;
  window.addEventListener('beforeinstallprompt',function(e){
    e.preventDefault();ev=e;
    var b=document.createElement('button');b.textContent='Установить приложение';
    b.style.cssText='position:fixed;right:14px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:99;padding:12px 16px;border:0;border-radius:99px;background:var(--accent);color:var(--on-accent);font:600 14px Onest,system-ui,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.25)';

    document.body.appendChild(b);
  });
})();
</script>
<script>
/* ===== Тёмная / светлая тема ===== */
(function(){
  var root=document.documentElement,meta=document.querySelector('meta[name="theme-color"]');
  var mq=window.matchMedia('(prefers-color-scheme: dark)');
  function saved(){try{return localStorage.getItem('theme')}catch(e){return null}}
  function isDark(){var t=root.getAttribute('data-theme');return t?t==='dark':mq.matches}
  var btn=document.createElement('button');btn.id='themeBtn';btn.type='button';
  function paint(){
    var d=isDark();
    btn.innerHTML=d?'<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>':'<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
    btn.setAttribute('aria-label',d?'Включить светлую тему':'Включить тёмную тему');
    if(meta)meta.setAttribute('content',d?'#10161A':'#7A1F3D');
  }
  var t=saved();if(t==='dark'||t==='light')root.setAttribute('data-theme',t);
  btn.onclick=function(){
    var n=isDark()?'light':'dark';root.setAttribute('data-theme',n);
    try{localStorage.setItem('theme',n)}catch(e){}
    paint();
  };
  mq.addEventListener&&mq.addEventListener('change',function(){if(!saved())paint()});
  document.body.appendChild(btn);paint();
})();
</script>
<script>
/* ===== Подгонка под экран, если оболочка приложения увеличивает страницу ===== */
(function(){
  function fit(){
    var app=document.getElementById('app'),btn=document.getElementById('themeBtn'),vv=window.visualViewport;
    if(!app||!vv)return;
    app.style.width='';app.style.height='';app.style.margin='';app.style.maxWidth='';
    if(btn){btn.style.left='';btn.style.right='';}
    var lw=document.documentElement.clientWidth;
    if(vv.scale>1.05&&vv.width<lw-8){
      app.style.margin='0';app.style.maxWidth='none';
      app.style.width=Math.floor(vv.width)+'px';
      app.style.height=Math.floor(vv.height)+'px';
      if(btn){btn.style.right='auto';btn.style.left=Math.floor(vv.offsetLeft+vv.width-48)+'px';}
    }
  }
  window.addEventListener('load',fit);
  window.addEventListener('orientationchange',function(){setTimeout(fit,300)});
  setTimeout(fit,400);setTimeout(fit,1500);
  window.__fit=fit;
})();
</script>
